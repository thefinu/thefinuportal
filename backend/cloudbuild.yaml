steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:latest'
      - '--file=backend/Dockerfile'
      - 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,SMTP_PASS=SMTP_PASS:latest'
      # The leading ^|^ sets "|" as the separator between KEY=VALUE pairs instead of the
      # default comma. GAS_OAUTH_CLIENT_IDS holds a comma-separated LIST, so with the
      # default separator gcloud would read the second client ID as a new variable name
      # and the deploy would fail. "|" is used because it appears in none of the values —
      # "@" would break the email addresses below.
      #
      # No spaces anywhere and no trailing separator: a space becomes part of the next
      # variable's name, and a trailing separator is read as an empty pair.
      #
      # GAS_OAUTH_CLIENT_IDS lists every OAuth client whose tokens this API accepts. The
      # Marketplace-published add-on and the Apps Script editor present DIFFERENT client
      # IDs, so both are listed; leaving one out rejects that surface with a 403.
      - '--update-env-vars=^|^NODE_ENV=production|SMTP_HOST=smtp.gmail.com|SMTP_PORT=587|SMTP_USER=anna@thefinu.com|CONTACT_EMAIL=anna@thefinu.com|GAS_OAUTH_CLIENT_IDS=1014598876589-emagvld0pum58tbdtsgceaij8k82sdht.apps.googleusercontent.com,1014598876589-36dskb92hja91lj3ca1f7vp9ohgh5a5r.apps.googleusercontent.com|APP_BASE_URL=https://thefinu.com'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:latest'

substitutions:
  _REGION: europe-west1
  _REPOSITORY: thefinuportal
  _SERVICE_NAME: thefinuportal-backend

options:
  logging: CLOUD_LOGGING_ONLY
