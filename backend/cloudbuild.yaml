steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:latest'
      - '--file=backend/Dockerfile'
      - 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,SMTP_PASS=SMTP_PASS:latest'
      # One comma-separated list of KEY=VALUE pairs, with no spaces and no trailing
      # comma: gcloud splits on commas, so a space becomes part of the next variable's
      # NAME and a trailing comma is read as an empty pair. Either one fails the deploy.
      #
      # GAS_OAUTH_CLIENT_IDS is the OAuth client whose tokens this API accepts. To allow
      # more than one, this flag cannot hold them — its own separator is the comma — so
      # use the alternate delimiter form: '--update-env-vars=^@^GAS_OAUTH_CLIENT_IDS=id1,id2@NODE_ENV=production'
      - '--update-env-vars=NODE_ENV=production,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=anna@thefinu.com,CONTACT_EMAIL=anna@thefinu.com,GAS_OAUTH_CLIENT_IDS=1014598876589-36dskb92hja91lj3ca1f7vp9ohgh5a5r.apps.googleusercontent.com,APP_BASE_URL=https://thefinu.com'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/backend:latest'

substitutions:
  _REGION: europe-west1
  _REPOSITORY: thefinuportal
  _SERVICE_NAME: thefinuportal-backend

options:
  logging: CLOUD_LOGGING_ONLY
